name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Unit tests (shared rules)
        run: npm test

      - name: Syntax check
        run: |
          node --check public/app.js
          node --check public/game.js
          node --check src/worker.js
          node --check scripts/smoke.mjs
          node --check test/game.test.js

      - name: Start wrangler dev
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "dev server did not start"
          cat dev.log
          exit 1

      - name: End-to-end API suite
        run: node scripts/smoke.mjs

      - name: 500-player load run
        run: node scripts/smoke.mjs --scale

      - name: Server log
        if: always()
        run: tail -50 dev.log || true
